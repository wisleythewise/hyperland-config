# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
# Commented out to prevent rainbow colors
# source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  # Equal gaps on all sides (half of previous horizontal spacing)
  gaps_in = 5
  gaps_out = 5

  col.active_border = rgb(7aa2f7) # Tokyo Night blue
  col.inactive_border = rgb(3b4261) # Tokyo Night fg_gutter
}

decoration {
  rounding = 0

  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.0
  dim_special = 0.0

  shadow {
    enabled = false
    range = 3
    render_power = 1

    color = rgb(7aa2f7)
    color_inactive = rgb(3b4261)
  }


  blur {
    enabled = false
    size = 6
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = rgb(7aa2f7)

	groupbar {
		col.active = rgb(7aa2f7)
  }
}
